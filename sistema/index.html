<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Quirosoft</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./index-BHSlr_sz.css" />
    <style>
      #login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f3f4f6;
        font-family: sans-serif;
      }
      .login-box {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 320px;
        text-align: center;
      }
      .login-box h2 { margin-bottom: 1.5rem; color: #1f2937; }
      .login-box input {
        width: 100%;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .login-box button {
        width: 100%;
        padding: 0.75rem;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      .login-box button:hover { background-color: #1d4ed8; }
      #erro-login { color: #dc2626; font-size: 0.875rem; margin-top: 0.5rem; display: none; }
    </style>
  </head>
  <body>
    <!-- Tela de Login -->
    <div id="login-container">
      <div class="login-box">
        <h2>Acesso ao Sistema</h2>
        <input type="text" id="usuario" placeholder="Usuário" />
        <input type="password" id="senha" placeholder="Senha" />
        <button onclick="fazerLogin()">Entrar</button>
        <p id="erro-login">Usuário ou senha incorretos!</p>
      </div>
    </div>

    <!-- Aplicação Principal (Oculta até o login) -->
    <div id="root" style="display: none;"></div>

    <script>
      // Configure aqui os 2 usuários e senhas
      const USUARIOS = {
        "Felipe": "quiro2026",
        "Vilma": "quiro2026"
      };

      function fazerLogin() {
        const u = document.getElementById("usuario").value;
        const s = document.getElementById("senha").value;

        if (USUARIOS[u] && USUARIOS[u] === s) {
          localStorage.setItem("quiro_autenticado", "true");
          mostrarSistema();
        } else {
          document.getElementById("erro-login").style.display = "block";
        }
      }

      function mostrarSistema() {
        document.getElementById("login-container").style.display = "none";
        document.getElementById("root").style.display = "block";
      }

      // Verifica se já está logado ao abrir a página
      if (localStorage.getItem("quiro_autenticado") === "true") {
        mostrarSistema();
      }
    </script>
    <script type="module" src="./index-lKgikGPz.js"></script>
  </body>
</html>
